name: Platform verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: make verify-untouched
      - run: npm run lint && npm run typecheck
      - run: npm test && npm run eval
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --audit-level=high
      - run: python3 scripts/secret-scan.py
      - run: docker build -f infra/Dockerfile -t dhaaga:test .
      - run: |
          docker run -d --name dhaaga-smoke -p 8787:8787 dhaaga:test
          for attempt in 1 2 3 4 5; do
            curl --fail http://127.0.0.1:8787/healthz && exit 0
            sleep 2
          done
          docker logs dhaaga-smoke
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: cd apps/mobile && npm ci && npm run typecheck
