builders:
  typed_json:
    import: package:dhaaga_typed_json/builder.dart
    builder_factories: [typedJson]
    build_extensions: {'.dart': ['.typed_json.g.part']}
    auto_apply: dependents
    build_to: cache
    applies_builders: [source_gen:combining_builder]

  typed_arb:
    import: package:dhaaga_typed_json/arb_builder.dart
    builder_factories: [typedArb]
    build_extensions: {'lib/l10n/app_en.arb': ['lib/core/localization/app_strings.dart']}
    auto_apply: dependents
    build_to: source
